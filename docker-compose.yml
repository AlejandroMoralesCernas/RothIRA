services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "0:80"
    container_name: react_frontend

  frontend_dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-frontend
    ports:
      - "3030:3030"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    container_name: react_frontend_development
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - CORS_ALLOWED_ORIGIN=http://localhost:3030
    container_name: go_lang_prod

  airapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    container_name: go_lang_air
    networks:
      - app-network

  debugger:
    build:
      context: .
      dockerfile: Dockerfile.debug
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - PORT=3000
    container_name: go_lang_debugger

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: rothira
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
